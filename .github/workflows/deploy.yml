# Builds the web version and publishes it to Cloudflare on every push to the
# default branch, as a Worker serving static assets (see wrangler.jsonc).
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
#
# Without those secrets a push still builds and tests but publishes nothing;
# a manual run fails instead, because asking for a deploy and silently getting
# none is the one outcome worth making loud.
name: Deploy to Cloudflare

on:
  push:
    # This repository's default branch is the development branch below; main
    # and master are listed so the workflow keeps working if it is ever
    # renamed or a conventional default branch is added.
    branches: [main, master, claude/voxel-sandbox-game-lk32gp]
  workflow_dispatch:

env:
  # Electron's postinstall pulls a ~266 MB binary that only the desktop build
  # ever uses. Skipping it roughly halves install time here and on any other
  # web-only build. Electron reads this exact variable name; note that putting
  # it in .npmrc does not work, as npm exposes those as npm_config_* instead.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Secrets cannot be read in an `if:` directly, so the presence of the
      # token is surfaced as an output first.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set; nothing will be published."
          fi

      - name: Publish to Cloudflare
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # A manual run means someone explicitly asked for a deploy. Ending green
      # without having published would hide that from them.
      - name: Fail a manual run that could not publish
        if: github.event_name == 'workflow_dispatch' && steps.creds.outputs.ready != 'true'
        run: |
          echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets," >&2
          echo "then run this workflow again. Nothing was published." >&2
          exit 1
